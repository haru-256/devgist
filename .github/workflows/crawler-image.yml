name: Crawler image

on:
  push:
    branches:
      - main
    paths:
      - "workflows/crawler/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push crawler image
    runs-on: ubuntu-latest
    env:
      REPO_URL: us-central1-docker.pkg.dev/haru256-devgist-ops/crawler
      IMAGE_NAME: crawler
      PLATFORM: linux/amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: haru256-devgist-ops
          workload_identity_provider: ${{ vars.GCP_GITHUB_WIF_PROVIDER }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          commit="$(git log -1 --format=%H -- workflows/crawler)"
          if [[ -z "${commit}" ]]; then
            echo "Could not resolve the last commit that touched workflows/crawler" >&2
            exit 1
          fi
          tag="$(git rev-parse --short "${commit}")"
          echo "Resolved crawler image tag ${tag} from ${commit}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          log="$(mktemp)"
          ./workflows/crawler/scripts/build-push-image.sh | tee "${log}"
          image_ref="$(sed -n 's/^image_ref: //p' "${log}" | tail -n 1)"
          if [[ -z "${image_ref}" ]]; then
            echo "build-push-image.sh did not print image_ref" >&2
            exit 1
          fi
          echo "image_ref: ${image_ref}" >> "${GITHUB_STEP_SUMMARY}"
