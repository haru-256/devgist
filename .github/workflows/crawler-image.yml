name: Crawler image

on:
  push:
    paths:
      - "workflows/crawler/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push crawler image
    runs-on: ubuntu-latest
    environment: dev
    env:
      REPO_URL: ${{ vars.CRAWLER_REPO_URL }}
      IMAGE_NAME: ${{ vars.CRAWLER_IMAGE_NAME }}
      PLATFORM: linux/amd64
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: haru256-devgist-ops
          workload_identity_provider: ${{ vars.GCP_GITHUB_WIF_PROVIDER }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REPO_URL%%/*}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          set -euo pipefail
          log="$(mktemp)"
          ./workflows/crawler/scripts/build-push-image.sh | tee "${log}"
          image_ref="$(sed -n 's/^image_ref: //p' "${log}" | tail -n 1)"
          if [[ -z "${image_ref}" ]]; then
            echo "build-push-image.sh did not print image_ref" >&2
            exit 1
          fi
          echo "image_ref: ${image_ref}" >> "${GITHUB_STEP_SUMMARY}"
