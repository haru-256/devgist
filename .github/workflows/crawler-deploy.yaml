name: Crawler Deploy

# INFRA-ADR-019: write 系の ci_scope は protected main に閉じる。
on:
  push:
    branches:
      - "main"
    paths:
      - "workflows/crawler/**"
      - "!workflows/crawler/**/*.md"
      - "!workflows/crawler/docs/**"
      - ".github/workflows/crawler-deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push crawler image
    if: ${{ vars.GCP_GITHUB_WIF_PROVIDER != '' && vars.CRAWLER_REPO_URL != '' && vars.CRAWLER_IMAGE_NAME != '' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      REPO_URL: ${{ vars.CRAWLER_REPO_URL }}
      IMAGE_NAME: ${{ vars.CRAWLER_IMAGE_NAME }}
      PLATFORM: linux/amd64
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: haru256-devgist-ops
          workload_identity_provider: ${{ vars.GCP_GITHUB_WIF_PROVIDER }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REPO_URL%%/*}" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        run: |
          set -o pipefail
          ./workflows/crawler/scripts/build-push-image.sh | tee -a "${GITHUB_STEP_SUMMARY}"
